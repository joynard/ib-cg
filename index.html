<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IB Game Hub</title>
  <meta name="description" content="IB Game Hub - Portal game icebreaker Connect Group.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Favicon / App Icon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <!-- Ambient Warm Brown Glow Elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="portal-container">
    <!-- Header -->
    <header class="portal-header">
      <h1 class="portal-title">IB <span class="highlight">GAME HUB</span></h1>
    </header>

    <!-- Game Cards Grid -->
    <main class="games-grid" id="gamesGrid">
      <noscript>
        <article class="game-card">
          <div class="card-content">
            <h2 class="game-title">Anonymous Box</h2>
            <p class="game-description">
              Tulis cerita atau rahasia kecilmu secara anonim ke dalam Box. Tebak siapa penulisnya dan rasakan momen seru bersama teman CG-mu.
            </p>
          </div>
          <div class="card-actions">
            <a href="anonymous-box.html" class="btn-play">Mainkan Game</a>
          </div>
        </article>
      </noscript>
    </main>
  </div>

  <!-- Modal Popup Diluar Schedule -->
  <div id="scheduleModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h3 class="modal-title" id="modalTitle">Diluar Schedule</h3>
      <p class="modal-body" id="modalDesc">
        Game ini sedang tidak aktif minggu ini.
      </p>
      <button class="btn-modal-close" id="btnModalClose">Mengerti</button>
    </div>
  </div>

  <script src="portal.js"></script>
</body>
</html>
